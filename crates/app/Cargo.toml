[package]
name = "sovereign-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
description = "Composition root: wires the sovereign core to its adapters and runs the bounded supervision loop."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "sovereign"
path = "src/main.rs"

[[bin]]
name = "sovereign-inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "sovereign-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "sovereign-backfill"
path = "src/bin/backfill.rs"

[[bin]]
name = "sovereign-scenario"
path = "src/bin/scenario.rs"

[[bin]]
name = "sovereign-episodes"
path = "src/bin/episodes.rs"

[[bin]]
name = "sovereign-inject"
path = "src/bin/inject.rs"

[dependencies]
sovereign-core = { path = "../core" }
sovereign-adapters = { path = "../adapters" }

[lints]
workspace = true
