name: quality-gate

# Zero-touch quality gates. A commit that fails any of
# these is, by definition, not working code — it cannot merge. Style is not up
# for human debate; the pipeline decides.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The toolchain is pinned by rust-toolchain.toml, so every runner compiles
      # with the exact same compiler (reproducible builds).
      - name: Formatting is not negotiable
        run: cargo fmt --all --check

      - name: Warnings are errors
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests must pass
        run: cargo test --all --locked

      # The toolkit's independence is a guarantee, not a hope: its core must build
      # with zero std and zero dependencies. If a std leak ever sneaks
      # in, this fails.
      - name: The sovds core stays no_std
        run: cargo build -p sovds --no-default-features --locked

      # Reproducibility is a core guarantee: the same source must produce
      # byte-identical binaries. The gate self-verifies by building twice and
      # comparing every shipped binary's hash.
      - name: Builds are reproducible
        run: sh scripts/reproducible-build.sh

      # On-router shell scripts: lint, then the offline checks with every
      # router command stubbed and the network cut.
      - name: Router scripts pass shellcheck
        run: shellcheck -s sh deploy/router/dns-selfheal deploy/router/podkop-selfheal deploy/router/sovereign-autoinject deploy/router/sovereign-clash-local deploy/router/sovereign-probe deploy/router/sovereign-ruleset-local deploy/router/telemetry.sh deploy/router/wan-selfheal deploy/router/tests/*.sh scripts/test-router.sh

      - name: Router scripts behave offline
        run: sh scripts/test-router.sh

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Toolchain pinned by proofs/lean-toolchain.
      - name: Lean spec of classify builds
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: proofs
